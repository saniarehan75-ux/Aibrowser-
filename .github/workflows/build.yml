name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q ./*.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk AIBrowser.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AIBrowser-apk
          path: AIBrowser.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AI Browser build ${{ github.run_number }}
          files: AIBrowser.apk
